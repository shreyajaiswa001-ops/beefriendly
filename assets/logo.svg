<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9A8D4"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <ellipse cx="120" cy="140" rx="40" ry="44"/>
    </clipPath>
  </defs>

  <!-- badge -->
  <circle cx="120" cy="120" r="112" fill="url(#ring)"/>
  <circle cx="120" cy="120" r="101" fill="#FFFFFF"/>

  <!-- tiny fluttering wings -->
  <ellipse cx="92" cy="88" rx="26" ry="15" fill="#BFDBFE" opacity="0.95"
           transform="rotate(-28 92 88)"/>
  <ellipse cx="148" cy="88" rx="26" ry="15" fill="#DBEAFE" opacity="0.95"
           transform="rotate(28 148 88)"/>
  <!-- wing shine lines -->
  <path d="M80 82 Q90 72 102 70" stroke="#93C5FD" stroke-width="3"
        fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M160 82 Q150 72 138 70" stroke="#93C5FD" stroke-width="3"
        fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- stubby cute antennae -->
  <path d="M106 100 Q100 86 90 82" stroke="#78350F" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <path d="M134 100 Q140 86 150 82" stroke="#78350F" stroke-width="5"
        fill="none" stroke-linecap="round"/>
  <circle cx="88" cy="80" r="6" fill="#F59E0B" stroke="#78350F" stroke-width="3"/>
  <circle cx="152" cy="80" r="6" fill="#F59E0B" stroke="#78350F" stroke-width="3"/>

  <!-- small plump body -->
  <ellipse cx="120" cy="140" rx="40" ry="44"
           fill="#FFD166" stroke="#78350F" stroke-width="5"/>

  <!-- stripes (clipped) -->
  <g clip-path="url(#bodyClip)">
    <rect x="74" y="146" width="92" height="13" fill="#78350F"/>
    <rect x="74" y="170" width="92" height="13" fill="#78350F"/>
  </g>

  <!-- BIG kawaii eyes with shine -->
  <circle cx="104" cy="126" r="10" fill="#111827"/>
  <circle cx="136" cy="126" r="10" fill="#111827"/>
  <circle cx="100.5" cy="122.5" r="3.2" fill="#FFFFFF"/>
  <circle cx="132.5" cy="122.5" r="3.2" fill="#FFFFFF"/>

  <!-- pink blush cheeks -->
  <ellipse cx="94" cy="136" rx="7.5" ry="4.5" fill="#FB7185" opacity="0.75"/>
  <ellipse cx="146" cy="136" rx="7.5" ry="4.5" fill="#FB7185" opacity="0.75"/>

  <!-- tiny happy smile -->
  <path d="M110 134 Q120 142 130 134" stroke="#7C2D12" stroke-width="4"
        fill="none" stroke-linecap="round"/>

  <!-- tiny stinger -->
  <path d="M114 184 L126 184 L120 196 Z" fill="#78350F"/>
</svg>
